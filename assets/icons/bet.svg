<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Bet">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF3AA"/>
      <stop offset="0.36" stop-color="#FFD45B"/>
      <stop offset="0.72" stop-color="#D99A20"/>
      <stop offset="1" stop-color="#FFF0A0"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#19447F"/>
      <stop offset="1" stop-color="#07162E"/>
    </linearGradient>
  </defs>

  <!-- betting chip -->
  <circle cx="32" cy="32" r="25"
          fill="url(#blue)" stroke="url(#gold)" stroke-width="3"/>

  <!-- chip edge segments -->
  <path d="M32 7v8M32 49v8M7 32h8M49 32h8
           M14.3 14.3l5.6 5.6M44.1 44.1l5.6 5.6
           M49.7 14.3l-5.6 5.6M19.9 44.1l-5.6 5.6"
        fill="none" stroke="url(#gold)" stroke-width="4"
        stroke-linecap="round"/>

  <!-- inner chip ring -->
  <circle cx="32" cy="32" r="15.5"
          fill="#0A2347" stroke="#49B8FF" stroke-width="2"/>

  <!-- central aviation coin/star -->
  <circle cx="32" cy="32" r="10"
          fill="url(#gold)" stroke="#07162E" stroke-width="1.5"/>

  <path d="M27.3 32 21 29.4l2 2.7-2 2.7 6.3-2.6M36.7 32l6.3-2.6-2 2.7 2 2.7-6.3-2.6"
        fill="#123766" stroke="#0A2347" stroke-width=".7"
        stroke-linejoin="round"/>

  <path d="m32 25.5 1.8 3.65 4.03.59-2.92 2.84.69 4.02L32 34.7l-3.6 1.9.69-4.02-2.92-2.84 4.03-.59L32 25.5Z"
        fill="#49B8FF" stroke="#E3F8FF" stroke-width=".7"/>
</svg>
