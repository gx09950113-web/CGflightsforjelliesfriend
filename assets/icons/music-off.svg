<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Music Off">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF3AA"/>
      <stop offset="0.36" stop-color="#FFD45B"/>
      <stop offset="0.72" stop-color="#D99A20"/>
      <stop offset="1" stop-color="#FFF0A0"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#19447F"/>
      <stop offset="1" stop-color="#07162E"/>
    </linearGradient>
  </defs>

  <!-- aviation badge, matched to music-on -->
  <circle cx="32" cy="32" r="24"
          fill="url(#blue)" stroke="url(#gold)" stroke-width="3"/>

  <path d="M9.5 27 3.5 31.5 10 35h6M54.5 27l6 4.5-6.5 3.5h-6"
        fill="none" stroke="url(#gold)" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="32" cy="32" r="17.5"
          fill="none" stroke="#49B8FF" stroke-width="1.7" opacity=".9"/>

  <!-- simplified treble clef -->
  <path d="M35 15
           C29.5 19 28 24 30.7 28.7
           C33.5 33.4 40.6 32.5 41.3 27.2
           C41.8 23.2 37.8 21.2 34 23.5
           C29.2 26.4 26.7 32.4 27.8 38
           C28.8 43.2 34 46.4 38.3 44.3
           C41.7 42.6 42.1 38.7 40.2 36.6"
        fill="none" stroke="url(#gold)" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M35 15 31.8 48.5"
        fill="none" stroke="#49B8FF" stroke-width="1.9"
        stroke-linecap="round"/>

  <ellipse cx="29.8" cy="49" rx="4.2" ry="2.7"
           transform="rotate(-18 29.8 49)"
           fill="url(#gold)"/>

  <!-- muted slash -->
  <path d="M17 17 47 47"
        fill="none" stroke="#07162E" stroke-width="7"
        stroke-linecap="round"/>

  <path d="M17 17 47 47"
        fill="none" stroke="url(#gold)" stroke-width="4"
        stroke-linecap="round"/>

  <path d="M19.5 19.5 44.5 44.5"
        fill="none" stroke="#FFF4B0" stroke-width="1"
        stroke-linecap="round" opacity=".85"/>

  <!-- top aviation star -->
  <path d="m32 6.5 1.1 2.25 2.5.36-1.8 1.76.42 2.48L32 12.18l-2.23 1.17.43-2.48-1.8-1.76 2.5-.36L32 6.5Z"
        fill="#49B8FF" stroke="#E3F8FF" stroke-width=".6"/>
</svg>
