<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Back">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF3AA"/>
      <stop offset="0.36" stop-color="#FFD45B"/>
      <stop offset="0.72" stop-color="#D99A20"/>
      <stop offset="1" stop-color="#FFF0A0"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#19447F"/>
      <stop offset="1" stop-color="#07162E"/>
    </linearGradient>
  </defs>

  <!-- outer badge -->
  <circle cx="32" cy="32" r="25"
          fill="url(#blue)" stroke="url(#gold)" stroke-width="3"/>

  <!-- back arrow -->
  <path d="M30 18 16 32l14 14"
        fill="none" stroke="url(#gold)" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M18 32h29"
        fill="none" stroke="#49B8FF" stroke-width="4"
        stroke-linecap="round"/>

  <!-- small highlight -->
  <path d="M23 23.5 16 32l7 8.5"
        fill="none" stroke="#FFF4B0" stroke-width="1.4"
        stroke-linecap="round" opacity=".85"/>
</svg>
