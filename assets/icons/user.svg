<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="User">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF3AA"/>
      <stop offset="0.36" stop-color="#FFD45B"/>
      <stop offset="0.72" stop-color="#D99A20"/>
      <stop offset="1" stop-color="#FFF0A0"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#19447F"/>
      <stop offset="1" stop-color="#07162E"/>
    </linearGradient>
  </defs>

  <!-- aviation badge -->
  <circle cx="32" cy="32" r="25"
          fill="url(#blue)" stroke="url(#gold)" stroke-width="3"/>

  <!-- wing accents -->
  <path d="M9.5 29 4 32.5 10 36h5M54.5 29l5.5 3.5-6 3.5h-5"
        fill="none" stroke="url(#gold)" stroke-width="2.3"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- pilot/user head -->
  <circle cx="32" cy="23.5" r="8.2"
          fill="url(#gold)" stroke="#07162E" stroke-width="1.8"/>

  <!-- headset band -->
  <path d="M24.5 23a7.5 7.5 0 0 1 15 0"
        fill="none" stroke="#49B8FF" stroke-width="2"
        stroke-linecap="round"/>

  <path d="M23.5 23.5v5M40.5 23.5v5"
        fill="none" stroke="#49B8FF" stroke-width="2.5"
        stroke-linecap="round"/>

  <path d="M40.5 28.5c0 3-2.2 4-5 4"
        fill="none" stroke="#49B8FF" stroke-width="1.7"
        stroke-linecap="round"/>

  <!-- shoulders / profile -->
  <path d="M16.5 49c1.6-9 7.3-14 15.5-14s13.9 5 15.5 14"
        fill="url(#gold)" stroke="#07162E" stroke-width="2"
        stroke-linejoin="round"/>

  <path d="M23 48c1.2-5 4.2-7.5 9-7.5s7.8 2.5 9 7.5"
        fill="#0C2A53" stroke="#49B8FF" stroke-width="1.4"
        stroke-linecap="round"/>

  <!-- top star -->
  <path d="m32 6.5 1.05 2.15 2.38.35-1.72 1.67.4 2.36L32 11.92l-2.11 1.11.4-2.36-1.72-1.67 2.38-.35L32 6.5Z"
        fill="#49B8FF" stroke="#E3F8FF" stroke-width=".55"/>
</svg>
