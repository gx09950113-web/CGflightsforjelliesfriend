<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Music On">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF3AA"/>
      <stop offset="0.36" stop-color="#FFD45B"/>
      <stop offset="0.72" stop-color="#D99A20"/>
      <stop offset="1" stop-color="#FFF0A0"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#19447F"/>
      <stop offset="1" stop-color="#07162E"/>
    </linearGradient>
  </defs>

  <!-- aviation badge -->
  <circle cx="32" cy="32" r="24"
          fill="url(#blue)" stroke="url(#gold)" stroke-width="3"/>

  <!-- wing accents -->
  <path d="M9.5 27 3.5 31.5 10 35h6M54.5 27l6 4.5-6.5 3.5h-6"
        fill="none" stroke="url(#gold)" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- inner electric ring -->
  <circle cx="32" cy="32" r="17.5"
          fill="none" stroke="#49B8FF" stroke-width="1.7" opacity=".9"/>

  <!-- stylized treble clef -->
  <path d="M35.5 14.5
           C29.5 18.5 27.5 24.2 30.5 29.2
           C33.5 34.2 41.5 32.8 42 27
           C42.5 21.8 36.8 20.4 32.8 23.5
           C28.4 26.9 25.8 32.5 27 38.3
           C28.2 44.2 34.3 48 39.3 45.2
           C44 42.6 43.8 36.7 40.1 34.7
           C36.9 33 32.9 34.7 32.4 38.1
           C31.9 41.4 34.6 44.1 37.4 43.4
           C40.5 42.6 41.2 39.2 39.5 37.4"
        fill="none" stroke="url(#gold)" stroke-width="3.2"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- treble clef stem -->
  <path d="M35.5 14.5 31.8 49.2"
        fill="none" stroke="#49B8FF" stroke-width="2"
        stroke-linecap="round"/>

  <!-- lower note curl -->
  <ellipse cx="29.7" cy="49.5" rx="4.5" ry="2.9"
           transform="rotate(-18 29.7 49.5)"
           fill="url(#gold)" stroke="#FFF5BD" stroke-width=".6"/>

  <!-- top aviation star -->
  <path d="m32 6.5 1.1 2.25 2.5.36-1.8 1.76.42 2.48L32 12.18l-2.23 1.17.43-2.48-1.8-1.76 2.5-.36L32 6.5Z"
        fill="#49B8FF" stroke="#E3F8FF" stroke-width=".6"/>
</svg>
