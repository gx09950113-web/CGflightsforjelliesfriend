        stroke-linecap="round"/>

  <!-- climbing aircraft silhouette -->
  <path d="M18.2 39.5
           27.5 33.8
           34.5 15.5
           38.5 12.5
           40 14.2
           38.2 29.2
           49.5 22.5
           54.8 23.8
           55.5 26.2
           40.2 37
           38.5 47.8
           34.8 50.5
           32.5 39.8
           24.5 43.5
           18.2 42.2Z"
        fill="url(#gold)" stroke="#07162E" stroke-width="2"
        stroke-linejoin="round"/>

  <!-- fuselage highlight -->
  <path d="M23 39.5 36.5 31 38.2 17"
        fill="none" stroke="#FFF5BD" stroke-width="1.2"
        stroke-linecap="round" opacity=".85"/>

  <!-- blue aviation accent -->
  <path d="M31.5 37.2 39.8 31.8 48.5 26.8"
