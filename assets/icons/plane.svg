<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Plane">
  <defs>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#D99A20"/>
      <stop offset="0.45" stop-color="#FFD45B"/>
      <stop offset="1" stop-color="#FFF3AA"/>
    </linearGradient>
  </defs>

  <!-- speed lines -->
  <path d="M6 49 22 40M10 55 25 46M6 42l12-7"
        fill="none" stroke="#49B8FF" stroke-width="2.8"
