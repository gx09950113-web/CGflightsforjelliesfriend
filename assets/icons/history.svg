<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="History">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF3AA"/>
      <stop offset="0.36" stop-color="#FFD45B"/>
      <stop offset="0.72" stop-color="#D99A20"/>
      <stop offset="1" stop-color="#FFF0A0"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#19447F"/>
      <stop offset="1" stop-color="#07162E"/>
    </linearGradient>
  </defs>

  <!-- history ring -->
  <path d="M16.8 19.2A23 23 0 1 1 10 35"
        fill="none" stroke="url(#gold)" stroke-width="5"
        stroke-linecap="round"/>

  <!-- return arrow -->
  <path d="M7.5 17.5v15h15"
        fill="none" stroke="url(#gold)" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M8.5 31.5 18 22"
        fill="none" stroke="#FFF4B0" stroke-width="1.4"
        stroke-linecap="round" opacity=".8"/>

  <!-- clock face -->
  <circle cx="34" cy="34" r="15.5"
          fill="url(#blue)" stroke="#3FAEFF" stroke-width="1.8"/>

  <!-- clock hands -->
  <path d="M34 24.5V34l7 5"
        fill="none" stroke="url(#gold)" stroke-width="3.2"
        stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="34" cy="34" r="2.3"
          fill="#49B8FF" stroke="#E1F7FF" stroke-width=".8"/>

  <!-- subtle aviation star -->
  <path d="m34 16.8.9 1.8 2 .3-1.45 1.4.35 2-1.8-.95-1.8.95.35-2-1.45-1.4 2-.3.9-1.8Z"
        fill="#FFF0A0"/>
</svg>
