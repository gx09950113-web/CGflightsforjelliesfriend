<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Statistics">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF3AA"/>
      <stop offset="0.36" stop-color="#FFD45B"/>
      <stop offset="0.72" stop-color="#D99A20"/>
      <stop offset="1" stop-color="#FFF0A0"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#19447F"/>
      <stop offset="1" stop-color="#07162E"/>
    </linearGradient>
  </defs>

  <!-- chart panel -->
  <rect x="8" y="9" width="48" height="46" rx="6"
        fill="url(#blue)" stroke="url(#gold)" stroke-width="3"/>

  <!-- axes -->
  <path d="M16 17v30h32"
        fill="none" stroke="#FFF0A0" stroke-width="2.4"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- bars -->
  <path d="M20 38h6v9h-6zM30 31h6v16h-6zM40 23h6v24h-6z"
        fill="url(#gold)" stroke="#B87916" stroke-width="1"/>

  <!-- rising trend -->
  <path d="m20 32 10-7 8 2 10-10"
        fill="none" stroke="#49B8FF" stroke-width="2.8"
        stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="20" cy="32" r="2" fill="#E2F7FF"/>
  <circle cx="30" cy="25" r="2" fill="#E2F7FF"/>
  <circle cx="38" cy="27" r="2" fill="#E2F7FF"/>
  <circle cx="48" cy="17" r="2" fill="#E2F7FF"/>

  <!-- aviation accent -->
  <path d="m48 17-5.2.4 2.2 2.2-.7 3.1 3.7-5.7Z"
        fill="#FFF0A0" stroke="#D99A20" stroke-width=".7"
        stroke-linejoin="round"/>
</svg>
