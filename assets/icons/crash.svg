<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Crash">
  <defs>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#D99A20"/>
      <stop offset="0.45" stop-color="#FFD45B"/>
      <stop offset="1" stop-color="#FFF3AA"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#49B8FF"/>
      <stop offset="1" stop-color="#164C88"/>
    </linearGradient>
  </defs>

  <!-- broken aircraft silhouette -->
  <path d="M12 21.5 27 27l8-16 4 1.5-3 17 12 5.5-2 4-13-3-8 15-4-1 3-16-14-8Z"
        fill="url(#gold)" stroke="#07162E" stroke-width="2"
        stroke-linejoin="round"/>

  <!-- fracture -->
  <path d="m31 26-4 5 5 2-4 5"
        fill="none" stroke="#07162E" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- impact / explosion burst -->
  <path d="m45 33 3.3 6.1 6.8-1.1-3.1 6.2 5.2 4.5-6.9 1.1-.7 6.9-5.2-4.6-5.6 4.1.8-6.9-6.6-2.1 5.7-4-3.9-5.8 6.6 2.2L45 33Z"
        fill="url(#blue)" stroke="url(#gold)" stroke-width="2"
        stroke-linejoin="round"/>

  <!-- sparks / debris -->
  <path d="M13 38 7 42M18 44l-3 7M44 19l4-6M51 25l6-2"
        fill="none" stroke="url(#gold)" stroke-width="2.4"
        stroke-linecap="round"/>

  <circle cx="10" cy="32" r="1.8" fill="#49B8FF"/>
  <circle cx="55" cy="31" r="1.6" fill="#FFF3AA"/>
</svg>
