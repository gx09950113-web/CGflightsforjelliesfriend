<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Sound Off">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF3AA"/>
      <stop offset="0.36" stop-color="#FFD45B"/>
      <stop offset="0.72" stop-color="#D99A20"/>
      <stop offset="1" stop-color="#FFF0A0"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#19447F"/>
      <stop offset="1" stop-color="#07162E"/>
    </linearGradient>
  </defs>

  <!-- speaker body, matched to sound-on -->
  <path d="M9 26h10l13-11v34L19 38H9z"
        fill="url(#blue)" stroke="url(#gold)" stroke-width="3"
        stroke-linejoin="round"/>

  <path d="M19 27.5 27.5 21v22L19 36.5Z"
        fill="#0D2B55" stroke="#49B8FF" stroke-width="1.4"
        stroke-linejoin="round"/>

  <!-- muted X -->
  <path d="M39 24 54 39M54 24 39 39"
        fill="none" stroke="url(#gold)" stroke-width="4.2"
        stroke-linecap="round"/>

  <!-- blue inner highlight -->
  <path d="M41.5 26.5 51.5 36.5"
        fill="none" stroke="#49B8FF" stroke-width="1.3"
        stroke-linecap="round" opacity=".9"/>

  <!-- aviation star accent -->
  <path d="m13 18 1.05 2.15 2.38.35-1.72 1.67.4 2.36L13 23.42l-2.11 1.11.4-2.36-1.72-1.67 2.38-.35L13 18Z"
        fill="#49B8FF" stroke="#E3F8FF" stroke-width=".55"/>
</svg>
