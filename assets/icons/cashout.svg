<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Cash Out">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF3AA"/>
      <stop offset="0.36" stop-color="#FFD45B"/>
      <stop offset="0.72" stop-color="#D99A20"/>
      <stop offset="1" stop-color="#FFF0A0"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#19447F"/>
      <stop offset="1" stop-color="#07162E"/>
    </linearGradient>
  </defs>

  <!-- cashout badge -->
  <circle cx="32" cy="32" r="25"
          fill="url(#blue)" stroke="url(#gold)" stroke-width="3"/>

  <!-- upward escape arrow -->
  <path d="M32 47V20"
        fill="none" stroke="#49B8FF" stroke-width="5"
        stroke-linecap="round"/>

  <path d="m21.5 29.5 10.5-11 10.5 11"
        fill="none" stroke="url(#gold)" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- payout coin -->
  <circle cx="46" cy="43.5" r="9"
          fill="url(#gold)" stroke="#07162E" stroke-width="1.8"/>

  <path d="M46 38v11M42.7 40.5h4.6a2 2 0 0 1 0 4h-2.6a2 2 0 0 0 0 4h4.6"
        fill="none" stroke="#123766" stroke-width="1.6"
        stroke-linecap="round"/>

  <!-- speed accents -->
  <path d="M15 43h11M17 49h8"
        fill="none" stroke="url(#gold)" stroke-width="2.2"
        stroke-linecap="round"/>

  <!-- aviation star -->
  <path d="m15.5 20 1.1 2.2 2.45.36-1.77 1.72.42 2.44-2.2-1.16-2.2 1.16.42-2.44-1.77-1.72 2.45-.36 1.1-2.2Z"
        fill="#49B8FF" stroke="#E3F8FF" stroke-width=".55"/>
</svg>
